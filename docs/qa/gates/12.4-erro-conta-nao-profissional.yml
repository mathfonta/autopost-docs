nfr_validation:
  security:
    status: PASS
    notes: 'Mensagem de erro exposta ao usuário é genérica por design (AC5) — detalhe real da falha só vai para logger.error no backend, nunca para a URL de redirect nem para o cliente. Sem dangerouslySetInnerHTML no toast (React escapa o texto automaticamente), sem risco de XSS refletido via query param. frontend_url do redirect vem de settings (não é user-controlled), sem risco de open redirect.'
  performance:
    status: PASS
    notes: 'Nenhum custo adicional relevante — um bloco try/except a mais e um branch de query param a mais, replicando padrão já existente.'
  reliability:
    status: CONCERNS
    notes: 'Cobertura por teste automatizado é sólida (mock do respx simula falha de token, valida redirect e query params). Mas comportamento real em produção contra a API real da Meta com uma conta pessoal genuína ainda não foi observado — ver MANUAL-001.'
  maintainability:
    status: PASS
    notes: 'Segue exatamente o padrão já usado no onboarding para o caso de sucesso (searchParams.get + toast) — nenhuma abstração nova, comentário explica por que a checagem de erro está fora do escopo de state JWT inválido (AC4).'

