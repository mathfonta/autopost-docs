story: '12.4'
story_title: 'Aviso e tratamento de erro para conta Instagram não-profissional'
gate: CONCERNS
status_reason: 'Implementação completa e correta por leitura de código: todos os 8 ACs verificados diretamente no código-fonte (não só no relato do @dev). Testes automatizados passam integralmente (18/18 em test_meta_oauth.py, incluindo o teste novo do caminho de erro; typecheck do frontend limpo). Único item pendente é MANUAL-001: o próprio @dev registrou não ter testado em navegador real, e o fluxo toca OAuth/redirect — categoria que, por aprendizado registrado na Story 22.5 deste mesmo projeto, historicamente esconde bugs de infraestrutura (env vars, ordem de checagem no useEffect) que só aparecem em teste manual real, não em revisão de código ou testes unitários.'
reviewer: 'Quinn (Test Architect)'
updated: '2026-07-24T00:00:00-03:00'

top_issues:
  - id: 'MANUAL-001'
    severity: medium
    finding: 'Fluxo de erro do OAuth (redirect com connected=false&error=... e o toast correspondente) nunca foi exercitado em navegador real contra o backend/frontend rodando de verdade — só via pytest (mock do exchange de token) e tsc --noEmit (checagem de tipos). O AC-alvo (usuário com conta pessoal do Instagram tentando conectar) é justamente o caso que só se comprova ao vivo.'
    suggested_action: 'Antes de considerar a story 100% fechada: testar manualmente em produção ou staging com uma conta Instagram pessoal (não-profissional) tentando conectar, confirmando que (a) o aviso preventivo aparece antes do clique, (b) o erro real da Meta cai no bloco try/except e redireciona com connected=false&error=..., (c) o toast de erro aparece na tela certa sem quebrar o onboarding. Não é obrigatório para o gate PASS, mas recomendado dado o histórico de bugs de infra em fluxos OAuth deste projeto (ver Story 22.5).'
    suggested_owner: dev

