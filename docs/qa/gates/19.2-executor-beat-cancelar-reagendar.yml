status_reason: 'Todos os 7 ACs confirmados por leitura direta do código. O claim atômico (UPDATE...RETURNING) implementa exatamente a decisão do Architecture Review — verificado que usa uma única query condicional, sem select-depois-update em dois passos. Endpoints de cancelar/reagendar replicam o padrão de auth/ownership/status já auditado na 19.1, com validação de janela temporal compartilhada via _validate_scheduled_for (boa decisão de reuso, evita duplicação). 20/20 testes próprios rodados por mim, suíte completa 391/391.'
