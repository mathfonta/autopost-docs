top_issues:
  - id: 'INFO-001'
    severity: low
    finding: 'A prova de idempotência sob concorrência real (dois ticks do Beat simultâneos nunca publicarem o mesmo post duas vezes) depende de uma garantia do Postgres (row-level locking em UPDATE) que não é possível provar com mocks — só com teste de integração contra um banco real. Os testes unitários cobrem o comportamento observável (claim vazio → nenhum publish_post disparado) e a forma da query (filtra status+scheduled_for, usa UPDATE...RETURNING), que é o que dá para verificar nesta camada.'
    suggested_action: 'Não bloqueante — comportamento correto por design e already confirmado no Architecture Review. Se quiser certeza absoluta, um teste de integração contra Postgres real (fora do escopo de testes unitários) seria o próximo passo, não urgente.'
