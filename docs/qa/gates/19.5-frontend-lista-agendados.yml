status_reason: 'CONCERN-001 corrigido e verificado: no catch de erro de cancelar/reagendar, ScheduledPostsSection agora recarrega a lista e verifica se o item ainda está presente — se não estiver (já publicado pelo Beat), mostra mensagem específica e o item some da UI; se ainda estiver (erro transiente real), mantém "tente de novo". Solução melhor que a sugestão original do QA (distingue os dois casos em vez de só recarregar). Verificado por leitura direta do código. Descoberta de arquitetura excelente também presente: o @dev percebeu que filtrar/ordenar client-side pela listagem paginada existente (created_at desc) faria posts agendados sumirem silenciosamente da tela, e corrigiu na raiz estendendo o backend com um parâmetro status + ordenação condicional por scheduled_for. Todos os 7 ACs confirmados. typecheck/build limpos.'
