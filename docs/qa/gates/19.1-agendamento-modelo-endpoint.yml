status_reason: 'Todos os 7 ACs confirmados por leitura direta do código (não só o relato do @dev). Migração segue exatamente o padrão já validado no projeto (e2f3a4b5c6d7) para ALTER TYPE ADD VALUE isolado de outros usos do valor na mesma transação — sem risco de erro em Postgres 12+. Endpoint replica fielmente o padrão de auth/ownership/status do /approve, que foi confirmado intocado (9/9 testes originais passando sem modificação). Suíte completa 368/368. Único achado é um LOW não-bloqueante para a Story 19.5 (ver FUTURE-001).'
