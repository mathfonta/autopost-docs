top_issues:
  - id: 'FUTURE-001'
    severity: low
    finding: '`scheduled_for` não está exposto em `ContentRequestDetailResponse` (nem, por consequência, em `ContentRequestListResponse`, que reusa o mesmo schema). Não é uma falha da Story 19.1 — nenhum AC pede isso — mas a Story 19.5 (tela "Posts agendados") vai precisar listar os posts agendados com seu horário, e hoje o GET /content-requests não devolve esse campo. A Story 19.4 não é afetada, porque a resposta do próprio POST /schedule já inclui scheduled_for.'
    suggested_action: 'Ao chegar na Story 19.5 (ou antes, na 19.2), adicionar `scheduled_for: datetime | None = None` em `ContentRequestDetailResponse` (app/schemas/content.py:25-49). Mudança de 1 linha, baixo risco.'
    suggested_owner: dev

  - id: 'INFO-001'
    severity: low
    finding: 'O endpoint normaliza `scheduled_for` sem timezone assumindo UTC (`if scheduled_for.tzinfo is None: scheduled_for = scheduled_for.replace(tzinfo=timezone.utc)`). Isso é um fallback defensivo — o AC4 espera que o body já venha com timezone (frontend da 19.4 deve sempre enviar ISO8601 com timezone) — mas não há teste cobrindo especificamente o caso de datetime naive.'
    suggested_action: 'Não bloqueante. Se quiser fechar 100%, adicionar 1 teste com datetime naive no body. Baixo valor dado que o comportamento correto (assumir UTC) já está implementado.'
    suggested_owner: dev

